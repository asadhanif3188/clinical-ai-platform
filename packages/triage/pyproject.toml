[project]
name = "clinical-ai-triage"
version = "0.1.0"
description = "Clinical triage package for Clinical AI Platform"
requires-python = ">=3.12"
dependencies = [
    "clinical-ai-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_ai_triage"]
