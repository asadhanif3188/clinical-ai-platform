[project]
name = "clinical-ai-clinflow"
version = "0.1.0"
description = "ClinFlow orchestration package for Clinical AI Platform"
requires-python = ">=3.12"
dependencies = [
    "clinical-ai-shared",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_ai_clinflow"]
